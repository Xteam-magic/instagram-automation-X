name: Instagram automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INSTAGRAM_POST_URLS: ${{ secrets.INSTAGRAM_POST_URLS }}
      INSTAGRAM_KEYWORDS: ${{ secrets.INSTAGRAM_KEYWORDS }}
      INSTAGRAM_COMMENT_REPLY: ${{ secrets.INSTAGRAM_COMMENT_REPLY }}
      INSTAGRAM_DM_REPLY: ${{ secrets.INSTAGRAM_DM_REPLY }}
      INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
      INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
      INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
      INSTAGRAM_HEADLESS: ${{ secrets.INSTAGRAM_HEADLESS }}
      INSTAGRAM_MAX_COMMENT_SCAN_ROUNDS: ${{ secrets.INSTAGRAM_MAX_COMMENT_SCAN_ROUNDS }}
      INSTAGRAM_COMMENT_SCROLL_PIXELS: ${{ secrets.INSTAGRAM_COMMENT_SCROLL_PIXELS }}
      INSTAGRAM_COMMENT_SCROLL_WAIT_MS: ${{ secrets.INSTAGRAM_COMMENT_SCROLL_WAIT_MS }}
      INSTAGRAM_COMMENT_END_STABLE_ROUNDS: ${{ secrets.INSTAGRAM_COMMENT_END_STABLE_ROUNDS }}
      INSTAGRAM_COMMENT_ROOT_TIMEOUT_MS: ${{ secrets.INSTAGRAM_COMMENT_ROOT_TIMEOUT_MS }}
      INSTAGRAM_COMMENT_CLICK_TIMEOUT_MS: ${{ secrets.INSTAGRAM_COMMENT_CLICK_TIMEOUT_MS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax check
        run: node --check src/index.mjs

      - name: Run Instagram engine
        run: npm run run

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
